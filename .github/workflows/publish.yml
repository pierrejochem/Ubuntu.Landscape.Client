name: Publish NuGet

# Publishes on a GitHub Release. Tag the release `vX.Y.Z` — the leading
# `v` is stripped and used as the package version.
on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=$VERSION

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: >
          dotnet pack Ubuntu.Landscape.Client/Ubuntu.Landscape.Client.csproj
          -c Release --no-build -p:Version=$VERSION -o artifacts

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
